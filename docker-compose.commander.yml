services:
  commander-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ptw_commander
      POSTGRES_USER: ptw_commander
      POSTGRES_PASSWORD: ${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}
    volumes:
      - commander-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptw_commander -d ptw_commander"]
      interval: 5s
      timeout: 3s
      retries: 20

  commander-migrate:
    image: postgres:16-alpine
    depends_on:
      commander-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./scripts/migrate_commander.sh:/scripts/migrate_commander.sh:ro
    command: ["sh", "/scripts/migrate_commander.sh"]

  commander-api:
    build:
      context: .
      dockerfile: commander/Dockerfile
    restart: unless-stopped
    depends_on:
      commander-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.commander
      - /opt/ptw/platform/.env
    environment:
      DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      COMMANDER_ASSET_DIR: /var/lib/ptw/assets
      CODEX_HOME: /run/ptw-auth
      CODEX_EXECUTABLE: /opt/ptw-codex/bin/codex
      COMMANDER_CHECKPOINT_MAX_AGE_SECONDS: ${COMMANDER_CHECKPOINT_MAX_AGE_SECONDS:-86400}
      COMMANDER_CHECKPOINT_REQUIRED: ${COMMANDER_CHECKPOINT_REQUIRED:-false}
    volumes:
      - commander-assets:/var/lib/ptw/assets
      - /root/.codex/packages/standalone/current:/opt/ptw-codex:ro
      - /root/.codex/auth.json:/run/ptw-auth/auth.json:ro
      - /root/.codex/skills/ptw-vps-operations:/run/ptw-auth/skills/ptw-vps-operations:ro
    networks:
      default:
        aliases: [ptw-commander-api]
      existing-ptw-backend:
        aliases: [ptw-creative-api, ptw-commander-api]
    ports:
      - "127.0.0.1:${COMMANDER_HTTP_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  commander-worker:
    build:
      context: .
      dockerfile: commander/Dockerfile
    restart: unless-stopped
    depends_on:
      commander-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.commander
      - /opt/ptw/platform/.env
    environment:
      DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      COMMANDER_ASSET_DIR: /var/lib/ptw/assets
    volumes:
      - commander-assets:/var/lib/ptw/assets
    command: ["python", "-m", "commander.worker"]

  commander-ad-worker:
    build:
      context: .
      dockerfile: commander/Dockerfile
    restart: unless-stopped
    depends_on:
      commander-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.commander
      - /opt/ptw/platform/.env
    environment:
      DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      COMMANDER_ASSET_DIR: /var/lib/ptw/assets
      COMMANDER_AD_IMAGE_MODEL: ${COMMANDER_AD_IMAGE_MODEL:-gpt-image-2}
      COMMANDER_AD_SPEC_MODEL: ${COMMANDER_AD_SPEC_MODEL:-gpt-5-mini}
      COMMANDER_AD_CONCLUSION_MODEL: ${COMMANDER_AD_CONCLUSION_MODEL:-gpt-5-mini}
    volumes:
      - commander-assets:/var/lib/ptw/assets
    command: ["python", "-m", "commander.ad_worker"]

  owner-gateway:
    build:
      context: .
      dockerfile: owner_gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      commander-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.owner-gateway
      - .env.commander
      - /opt/ptw/platform/.env
    environment:
      IDEA_DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      COMMANDER_DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-ptw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ptw}
      PTW_REPOSITORY_PATH: /workspace
      COMMANDER_POLICY_PATH: /workspace/config/commander/policies.json
      COMMANDER_ASSET_DIR: /var/lib/ptw/assets
      OWNER_CONTROL_DATABASE: /var/lib/ptw-owner/control.sqlite3
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      ROOT_BROKER_SOCKET: /run/ptw-root-broker/control.sock
      CODEX_HOME: /run/ptw-auth
      CODEX_EXECUTABLE: /opt/ptw-codex/bin/codex
      GH_CONFIG_DIR: /run/ptw-gh
    group_add:
      - "10001"
    volumes:
      - /root/ptw:/workspace
      - commander-assets:/var/lib/ptw/assets
      - owner-control:/var/lib/ptw-owner
      - /run/ptw-root-broker:/run/ptw-root-broker
      - /opt/ptw/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - /root/.codex/packages/standalone/current:/opt/ptw-codex:ro
      - /root/.codex/auth.json:/run/ptw-auth/auth.json:ro
      - /root/.codex/skills/ptw-vps-operations:/run/ptw-auth/skills/ptw-vps-operations:ro
      - /root/.config/gh:/run/ptw-gh:ro
      - /usr/bin/gh:/usr/local/bin/gh:ro
    networks:
      default:
      existing-ptw-backend:
        aliases: [ptw-owner-gateway]
    ports:
      - "127.0.0.1:${OWNER_GATEWAY_HTTP_PORT:-8092}:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  commander-db-data:
  commander-assets:
  owner-control:

networks:
  existing-ptw-backend:
    external: true
    name: ptw-agent-platform_backend
