name: ptw-validation

services:
  validation-api:
    image: ptw-validation:${PTW_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: validation_pipeline/Dockerfile
    restart: unless-stopped
    env_file:
      - path: /opt/ptw/platform/.env
        required: false
      - path: .env.owner-gateway
        required: true
      - path: .env.commander
        required: true
    environment:
      DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      OWNER_GATEWAY_BRIDGE_TOKEN: ${OWNER_GATEWAY_BRIDGE_TOKEN:?set OWNER_GATEWAY_BRIDGE_TOKEN}
      VALIDATION_LLM_BRIDGE_URL: ${VALIDATION_LLM_BRIDGE_URL:-http://ptw-agent-platform-commander-api-1:8000/internal/llm/structured}
      VALIDATION_LLM_MODEL: ${VALIDATION_LLM_MODEL:-codex-cli-default}
      PRODUCT_BRIEF_SKILL_PATH: /run/ptw-auth/skills/product-brief-generator/SKILL.md
      AD_CREATIVE_SKILL_PATH: /run/ptw-auth/skills/ad-creative-generator/SKILL.md
      PEXELS_API_KEY: ${PEXELS_API_KEY:?set PEXELS_API_KEY in the root-owned runtime environment}
    volumes:
      - ./skills:/run/ptw-auth/skills:ro
    networks:
      existing-ptw-backend:
        aliases: [ptw-validation-api]
      existing-commander-database:
    ports:
      - "127.0.0.1:${VALIDATION_HTTP_PORT:-8093}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 10

networks:
  existing-ptw-backend:
    external: true
    name: ptw-agent-platform_backend
  existing-commander-database:
    external: true
    name: ptw_default
