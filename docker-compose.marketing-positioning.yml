name: ptw-marketing-positioning

services:
  marketing-positioning-api:
    image: ptw-marketing-positioning:${PTW_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: marketing_positioning/Dockerfile
    restart: unless-stopped
    env_file:
      - path: /opt/ptw/platform/.env
        required: false
      - path: .env.owner-gateway
        required: true
      - path: .env.commander
        required: true
    environment:
      DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      OWNER_GATEWAY_BRIDGE_TOKEN: ${OWNER_GATEWAY_BRIDGE_TOKEN:?set OWNER_GATEWAY_BRIDGE_TOKEN}
      LLM_BRIDGE_URL: ${POSITIONING_LLM_BRIDGE_URL:-http://ptw-agent-platform-commander-api-1:8000/internal/llm/structured}
      POSITIONING_LLM_MODEL: ${POSITIONING_LLM_MODEL:-codex-cli-default}
      MARKETING_POSITIONING_SKILL_PATH: /run/ptw-auth/skills/marketing-positioning/SKILL.md
    volumes:
      - ./skills:/run/ptw-auth/skills:ro
    networks:
      existing-ptw-backend:
        aliases: [ptw-positioning-api]
      existing-commander-database:
    ports:
      - "127.0.0.1:${POSITIONING_HTTP_PORT:-8093}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 10

networks:
  existing-ptw-backend:
    external: true
    name: ptw-agent-platform_backend
  existing-commander-database:
    external: true
    name: ptw_default
