name: ptw-idea-generation

services:
  idea-generation-api:
    image: ptw-idea-generation:${PTW_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: idea_generation/Dockerfile
    restart: unless-stopped
    env_file:
      - path: /opt/ptw/platform/.env
        required: false
      - path: .env.owner-gateway
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?reuse the isolated application database URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?reuse the existing bot token}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:?reuse the owner allowlist}
      LLM_PROVIDER: ${LLM_PROVIDER:-bridge}
      LLM_MODEL: ${LLM_MODEL:-codex-cli-default}
      LLM_BRIDGE_URL: ${LLM_BRIDGE_URL:-http://ptw-agent-platform-commander-api-1:8000/internal/llm/structured}
      AD_BATCH_BRIDGE_URL: ${AD_BATCH_BRIDGE_URL:-http://ptw-commander-api:8080/internal/ad-batches}
      LAVAL_SEARCH_PROVIDER: ${LAVAL_SEARCH_PROVIDER:-fixture}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      DATAFORSEO_VERIFIED: ${DATAFORSEO_VERIFIED:-0}
      DATAFORSEO_POLL_TIMEOUT_SECONDS: ${DATAFORSEO_POLL_TIMEOUT_SECONDS:-3600}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_VERIFIED: ${YOUTUBE_VERIFIED:-0}
      YOUTUBE_RESULTS_PER_QUERY: ${YOUTUBE_RESULTS_PER_QUERY:-10}
      YOUTUBE_COMMENTS_PER_VIDEO: ${YOUTUBE_COMMENTS_PER_VIDEO:-20}
      LAVAL_TREND_PROVIDER: ${LAVAL_TREND_PROVIDER:-fixture}
      GOOGLE_TRENDS_BRIDGE_URL: ${GOOGLE_TRENDS_BRIDGE_URL:-}
      GOOGLE_TRENDS_BRIDGE_TOKEN: ${GOOGLE_TRENDS_BRIDGE_TOKEN:-}
      LAVAL_MAX_SPEND_USD: ${LAVAL_MAX_SPEND_USD:-0.05}
      LAVAL_RESERVED_SPEND_USD: ${LAVAL_RESERVED_SPEND_USD:-0.04}
      LAVAL_RESEARCH_BRIDGE_URL: ${LAVAL_RESEARCH_BRIDGE_URL:-http://ptw-commander-api:8080/internal/research/laval}
      OUTBOUND_NOTIFICATIONS_ENABLED: ${OUTBOUND_NOTIFICATIONS_ENABLED:-false}
      LAVAL_TELEGRAM_NOTIFICATIONS_ENABLED: ${LAVAL_TELEGRAM_NOTIFICATIONS_ENABLED:-true}
      BRAND_PROVIDER: ${BRAND_PROVIDER:-openai}
      BRAND_TEXT_MODEL: ${BRAND_TEXT_MODEL:-gpt-5-mini}
      BRAND_IMAGE_MODEL: ${BRAND_IMAGE_MODEL:-gpt-image-2}
      BRAND_ASSET_DIR: /var/lib/ptw/assets/brands
      BRAND_COMMANDER_BRIDGE_URL: http://ptw-commander-api:8080/internal/branding
      TZ: Europe/Kyiv
    volumes:
      - commander-assets:/var/lib/ptw/assets
    command: ["uvicorn", "idea_generation.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    networks:
      default:
      existing-ptw-backend:
        aliases: [ptw-idea-api]
      existing-commander-database:
    ports:
      - "127.0.0.1:${IDEA_GENERATION_HTTP_PORT:-8093}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  commander-assets:
    external: true
    name: ptw_commander-assets

networks:
  existing-ptw-backend:
    external: true
    name: ptw-agent-platform_backend
  existing-commander-database:
    external: true
    name: ptw_default
