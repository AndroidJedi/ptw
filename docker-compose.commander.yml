name: ptw

services:
  commander-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "effective_cache_size=192MB", "-c", "work_mem=1MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=20", "-c", "autovacuum_max_workers=1"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ptw_commander
      POSTGRES_USER: ptw_commander
      POSTGRES_PASSWORD: ${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}
    volumes:
      - commander-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptw_commander -d ptw_commander"]
      interval: 5s
      timeout: 3s
      retries: 20

  commander-migrate:
    image: postgres:16-alpine
    depends_on:
      commander-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./scripts/migrate_commander.sh:/scripts/migrate_commander.sh:ro
    command: ["sh", "/scripts/migrate_commander.sh"]

  commander-api:
    image: ${PTW_COMMANDER_IMAGE:-ptw-commander:${PTW_IMAGE_TAG:-latest}}
    pull_policy: never
    build:
      context: .
      dockerfile: commander/Dockerfile
    restart: unless-stopped
    depends_on:
      commander-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.commander
      - /opt/ptw/platform/.env
    environment:
      DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-ptw}:${POSTGRES_PASSWORD:?set platform POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ptw}
    networks:
      default:
        aliases: [ptw-commander-api]
      existing-ptw-backend:
        aliases: [ptw-commander-api]
    ports:
      - "127.0.0.1:${COMMANDER_HTTP_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  owner-gateway:
    image: ${PTW_OWNER_GATEWAY_IMAGE:-ptw-owner-gateway:${PTW_IMAGE_TAG:-latest}}
    pull_policy: never
    build:
      context: .
      dockerfile: owner_gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      commander-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.owner-gateway
      - .env.commander
    environment:
      VALIDATION_SERVICE_URL: http://ptw-validation-api:8080
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      PTW_CODEX_AUTH_SERVICE_URL: http://codex-auth:8094
      PTW_COMMANDER_SERVICE_URL: http://commander-god:8095
    volumes:
      - /opt/ptw/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    networks:
      default:
      existing-ptw-backend:
        aliases: [ptw-owner-gateway]
    ports:
      - "127.0.0.1:${OWNER_GATEWAY_HTTP_PORT:-8092}:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  commander-god:
    image: ${PTW_COMMANDER_GOD_IMAGE:-ptw-validation:${PTW_IMAGE_TAG:-latest}}
    pull_policy: never
    build:
      context: .
      dockerfile: commander_god/Dockerfile
    user: "0:0"
    command: ["uvicorn", "validation_pipeline.commander_host_api:create_app_from_env", "--factory", "--host", "0.0.0.0", "--port", "8095", "--no-access-log"]
    restart: unless-stopped
    environment:
      OWNER_GATEWAY_BRIDGE_TOKEN: ${OWNER_GATEWAY_BRIDGE_TOKEN:?set OWNER_GATEWAY_BRIDGE_TOKEN}
      PTW_COMMANDER_REPOSITORY: /workspace
      PTW_COMMANDER_STATE: /var/lib/ptw/commander-chat
      PTW_COMMANDER_TIMEOUT_SECONDS: "2400"
      CODEX_HOME: /var/lib/ptw/commander-chat/codex-home
      CODEX_EXECUTABLE: /opt/ptw-codex/bin/codex
      PTW_CODEX_CREDENTIAL: /run/ptw-codex-auth/auth.json
      HOME: /root
      PATH: /opt/ptw-codex/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - /opt/ptw/commander-workspace:/workspace
      - commander-god-state:/var/lib/ptw/commander-chat
      - /root/.codex/packages/standalone/current:/opt/ptw-codex:ro
      - /root/.codex/ptw-worker-credential:/run/ptw-codex-auth:ro
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 10
    networks:
      default:

volumes:
  commander-db-data:
  commander-god-state:

networks:
  existing-ptw-backend:
    external: true
    name: ptw-agent-platform_backend
