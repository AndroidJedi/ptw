name: ptw-agent-platform

x-app-environment: &app-environment
  PTW_ENV: ${PTW_ENV:-production}
  PTW_LOG_LEVEL: ${PTW_LOG_LEVEL:-INFO}
  POSTGRES_DB: ${POSTGRES_DB:-ptw}
  POSTGRES_USER: ${POSTGRES_USER:-ptw}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
  WORKSPACE_TELEGRAM_USER_ID: ${WORKSPACE_TELEGRAM_USER_ID:-}
  WORKSPACE_TELEGRAM_CHAT_ID: ${WORKSPACE_TELEGRAM_CHAT_ID:-}
  CODEX_METADATA_FILE: /run/ptw-host/codex-version
  SSH_AUTH_SOCK: /run/ptw-git-agent/agent.sock
  GIT_SSH_COMMAND: ssh -F /etc/ptw-git/ssh_config
  GH_CONFIG_DIR: /run/ptw-gh
  CODEX_HOME: /tmp/ptw-codex
  CODEX_EXECUTABLE: /opt/ptw-codex/bin/codex
  CODEX_MAX_RETRIES: ${CODEX_MAX_RETRIES:-2}
  BRAND_PROVIDER_ASSET_DIR: /var/lib/ptw/assets/brand-provider
  ATTACHMENT_INBOX_ROOT: /opt/ptw/workspaces/incoming
  CREATIVE_SERVICE_URL: http://ptw-creative-api:8080/internal/telegram/update
  GIT_MAIN_WATCH_INTERVAL_SECONDS: ${GIT_MAIN_WATCH_INTERVAL_SECONDS:-300}
  GIT_MAIN_WATCH_MAX_COMMITS: ${GIT_MAIN_WATCH_MAX_COMMITS:-5}

services:
  git-credential-agent:
    build:
      context: .
      dockerfile: infrastructure/git-agent/Dockerfile
    restart: unless-stopped
    volumes:
      - /root/.ssh/id_ed25519:/run/ptw-deploy-key/id_ed25519:ro
      - git-agent-socket:/run/ptw-git-agent
      - ./infrastructure/git-client/known_hosts:/run/ptw-known-hosts/known_hosts:ro
    healthcheck:
      test: ["CMD-SHELL", "SSH_AUTH_SOCK=/run/ptw-git-agent/agent.sock ssh-add -l >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ptw}
      POSTGRES_USER: ${POSTGRES_USER:-ptw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - /opt/ptw/persistent-data/postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  commander-api:
    image: ptw-agent-platform-commander-api:${PTW_PLATFORM_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: commander/Dockerfile
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - /opt/ptw/workspaces/incoming:/opt/ptw/workspaces/incoming
    security_opt:
      - no-new-privileges:true
    networks: [backend, edge]

  commander-worker:
    image: ptw-agent-platform-commander-worker:${PTW_PLATFORM_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      commander-api:
        condition: service_healthy
      git-credential-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - /opt/ptw/persistent-data/runtime:/run/ptw-host:ro
      - /opt/ptw/workspaces/jobs:/opt/ptw/workspaces/jobs
      - /opt/ptw/workspaces/incoming:/opt/ptw/workspaces/incoming:ro
      - git-agent-socket:/run/ptw-git-agent
      - ./infrastructure/git-client:/etc/ptw-git:ro
      - /usr/bin/gh:/usr/local/bin/gh:ro
      - /root/.config/gh:/run/ptw-gh:ro
      - /root/.codex/packages/standalone/current:/opt/ptw-codex:ro
      - /root/.codex/auth.json:/run/ptw-codex-auth/auth.json:ro
      - commander-assets:/var/lib/ptw/assets
    security_opt:
      - no-new-privileges:true
    networks: [backend, edge]

  git-watcher:
    build:
      context: .
      dockerfile: watcher/Dockerfile
    command: ["python", "-m", "watcher.main"]
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      commander-api:
        condition: service_healthy
      git-credential-agent:
        condition: service_healthy
    mem_limit: 96m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - git-agent-socket:/run/ptw-git-agent
      - ./infrastructure/git-client:/etc/ptw-git:ro
    security_opt:
      - no-new-privileges:true
    networks: [backend, edge]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      commander-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "127.0.0.1:${PTW_HTTP_PORT:-8080}:8080"
    environment:
      COMMANDER_PUBLIC_HOST: ${COMMANDER_PUBLIC_HOST:-commander.proove-them-wrong.com}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/ptw/persistent-data/caddy/data:/data
      - /opt/ptw/persistent-data/caddy/config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config/caddy:size=8m
    security_opt:
      - no-new-privileges:true
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  git-agent-socket:
  commander-assets:
    external: true
    name: ptw_commander-assets
