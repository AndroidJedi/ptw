name: ptw-agent-platform

x-app-environment: &app-environment
  PTW_ENV: ${PTW_ENV:-production}
  PTW_LOG_LEVEL: ${PTW_LOG_LEVEL:-INFO}
  POSTGRES_DB: ${POSTGRES_DB:-ptw}
  POSTGRES_USER: ${POSTGRES_USER:-ptw}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
  CODEX_HOME: /tmp/ptw-codex
  CODEX_EXECUTABLE: /opt/ptw-codex/bin/codex
  CREATIVE_SERVICE_URL: http://ptw-commander-api:8080/internal/telegram/update
  CONTENT_GRAPHIC_ASSET_DIR: /var/lib/ptw/assets/content-graphics

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ptw}
      POSTGRES_USER: ${POSTGRES_USER:-ptw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - /opt/ptw/persistent-data/postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    networks: [backend]

  commander-api:
    image: ptw-agent-platform-commander-api:${PTW_PLATFORM_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: commander/Dockerfile
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    read_only: true
    tmpfs:
      - "/tmp:size=16m,mode=1777"
    volumes:
      - commander-assets:/var/lib/ptw/assets:ro
    security_opt: [no-new-privileges:true]
    networks: [backend, edge]

  commander-worker:
    image: ptw-agent-platform-commander-worker:${PTW_PLATFORM_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      commander-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    read_only: true
    tmpfs:
      - "/tmp:size=64m,mode=1777"
    volumes:
      - /root/.codex/packages/standalone/current:/opt/ptw-codex:ro
      - /root/.codex/auth.json:/run/ptw-codex-auth/auth.json:ro
      - commander-assets:/var/lib/ptw/assets
    security_opt: [no-new-privileges:true]
    networks: [backend, edge]

  codex-auth:
    image: ptw-agent-platform-codex-auth:${PTW_PLATFORM_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: auth/Dockerfile
    restart: unless-stopped
    # This narrowly scoped process is the only container permitted to update the
    # existing root-owned Codex credential store.
    user: "0:0"
    group_add:
      - "10001"
    environment:
      CODEX_HOME: /root/.codex
      CODEX_EXECUTABLE: /opt/ptw-codex/bin/codex
      PTW_CODEX_WORKER_GID: "10001"
      PTW_CODEX_AUTH_BRIDGE_TOKEN: ${PTW_CODEX_AUTH_BRIDGE_TOKEN:?Set PTW_CODEX_AUTH_BRIDGE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    pids_limit: 32
    read_only: true
    tmpfs:
      - "/tmp:size=32m,mode=1777"
    volumes:
      - /root/.codex:/root/.codex
      - /root/.codex/packages/standalone/current:/opt/ptw-codex:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Device authorization and the post-login working test both require outbound
    # access, while the status API remains private on the backend network.
    networks: [backend, edge]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      commander-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "127.0.0.1:${PTW_HTTP_PORT:-8080}:8080"
    environment:
      COMMANDER_PUBLIC_HOST: ${COMMANDER_PUBLIC_HOST:-commander.proove-them-wrong.com}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/ptw/persistent-data/caddy/data:/data
      - /opt/ptw/persistent-data/caddy/config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config/caddy:size=8m
    security_opt: [no-new-privileges:true]
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  commander-assets:
    external: true
    name: ptw_commander-assets
