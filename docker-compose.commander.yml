services:
  commander-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ptw_commander
      POSTGRES_USER: ptw_commander
      POSTGRES_PASSWORD: ${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}
    volumes:
      - commander-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptw_commander -d ptw_commander"]
      interval: 5s
      timeout: 3s
      retries: 20

  commander-migrate:
    image: postgres:16-alpine
    depends_on:
      commander-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}
      DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
    volumes:
      - ./ideaGeneration:/app/ideaGeneration:ro
    command: ["sh", "/app/ideaGeneration/migrate.sh"]

  commander-api:
    build:
      context: .
      dockerfile: ideaGeneration/Dockerfile
    restart: unless-stopped
    depends_on:
      commander-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.commander
      - /opt/ptw/platform/.env
    environment:
      DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      SPEC_ROOT: /app/ideaGeneration/docs
      LLM_PROVIDER: ${LLM_PROVIDER:-bridge}
      LLM_BRIDGE_URL: http://ptw-agent-platform-commander-api-1:8000/internal/llm/structured
      AUTOPILOT_DEFAULT_ENABLED: "false"
    networks:
      default:
      existing-ptw-backend:
        aliases: [ptw-creative-api]
    ports:
      - "127.0.0.1:${COMMANDER_HTTP_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  commander-db-data:

networks:
  existing-ptw-backend:
    external: true
    name: ptw-agent-platform_backend
