name: ptw

services:
  commander-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "effective_cache_size=192MB", "-c", "work_mem=1MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=20", "-c", "autovacuum_max_workers=1"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ptw_commander
      POSTGRES_USER: ptw_commander
      POSTGRES_PASSWORD: ${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}
    volumes:
      - commander-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptw_commander -d ptw_commander"]
      interval: 5s
      timeout: 3s
      retries: 20

  commander-migrate:
    image: postgres:16-alpine
    depends_on:
      commander-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${COMMANDER_DB_PASSWORD:?set COMMANDER_DB_PASSWORD}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./scripts/migrate_commander.sh:/scripts/migrate_commander.sh:ro
    command: ["sh", "/scripts/migrate_commander.sh"]

  commander-api:
    image: ptw-commander:${PTW_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: commander/Dockerfile
    restart: unless-stopped
    depends_on:
      commander-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.commander
      - /opt/ptw/platform/.env
    environment:
      DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-ptw}:${POSTGRES_PASSWORD:?set platform POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ptw}
    networks:
      default:
        aliases: [ptw-commander-api]
      existing-ptw-backend:
        aliases: [ptw-commander-api]
    ports:
      - "127.0.0.1:${COMMANDER_HTTP_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  owner-gateway:
    image: ptw-owner-gateway:${PTW_IMAGE_TAG:-latest}
    pull_policy: never
    build:
      context: .
      dockerfile: owner_gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      commander-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.owner-gateway
      - .env.commander
      - /opt/ptw/platform/.env
    environment:
      POSITIONING_DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      POSITIONING_SERVICE_URL: http://ptw-positioning-api:8080
      COMMANDER_DATABASE_URL: postgresql://ptw_commander:${COMMANDER_DB_PASSWORD}@commander-db:5432/ptw_commander
      PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER:-ptw}:${POSTGRES_PASSWORD:?set platform POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ptw}
      PTW_REPOSITORY_PATH: /workspace
      OWNER_CONTROL_DATABASE: /var/lib/ptw-owner/control.sqlite3
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      FIREBASE_LANDING_SITE_ID: natal-landings-86123
      FIREBASE_LANDING_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-landing-service-account.json
      NATAL_LANDING_OUTPUT_ROOT: /var/lib/ptw-owner/landings
      LANDING_LLM_BRIDGE_URL: ${LANDING_LLM_BRIDGE_URL:-http://ptw-agent-platform-commander-api-1:8000/internal/llm/structured}
      LANDING_LLM_MODEL: ${LANDING_LLM_MODEL:-codex-cli-default}
      LANDING_LEAD_API_BASE_URL: ${LANDING_LEAD_API_BASE_URL:-https://commander.proove-them-wrong.com/api/v1/public/landings}
      LANDING_TRUSTED_PROXY_NETWORKS: ${LANDING_TRUSTED_PROXY_NETWORKS:?set exact Caddy proxy CIDR}
      ROOT_BROKER_SOCKET: /run/ptw-root-broker/control.sock
      CODEX_HOME: /run/ptw-auth
      CODEX_EXECUTABLE: /opt/ptw-codex/bin/codex
      GH_CONFIG_DIR: /run/ptw-gh
    group_add: ["10001"]
    volumes:
      - /root/ptw:/workspace
      - owner-control:/var/lib/ptw-owner
      - /run/ptw-root-broker:/run/ptw-root-broker
      - /opt/ptw/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - /opt/ptw/secrets/firebase-landing-service-account.json:/run/secrets/firebase-landing-service-account.json:ro
      - /root/.codex/packages/standalone/current:/opt/ptw-codex:ro
      - /root/.codex/auth.json:/run/ptw-auth/auth.json:ro
      - ./skills:/run/ptw-auth/skills
      - /root/.config/gh:/run/ptw-gh:ro
      - /usr/bin/gh:/usr/local/bin/gh:ro
    networks:
      default:
      existing-ptw-backend:
        aliases: [ptw-owner-gateway]
    ports:
      - "127.0.0.1:${OWNER_GATEWAY_HTTP_PORT:-8092}:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  commander-db-data:
  owner-control:

networks:
  existing-ptw-backend:
    external: true
    name: ptw-agent-platform_backend
